  <text x="1277" y="423" text-anchor="middle" class="tiny">3</text>
  <text x="1312" y="423" text-anchor="middle" class="tiny">4</text>
  <text x="1347" y="423" text-anchor="middle" class="tiny">5</text>
  <text x="1268" y="351" text-anchor="middle" class="small blue">five step features</text>
  <text x="1277" y="478" text-anchor="middle" class="tiny muted">mean pool → Pmulti</text>

