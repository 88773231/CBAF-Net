    </marker>
    <style>
      text { font-family: Arial, "DejaVu Sans", sans-serif; fill: #203244; }
      .head { font-size: 37px; font-weight: 700; }
      .label { font-size: 31px; font-weight: 700; }
      .small { font-size: 26px; }
      .tiny { font-size: 23px; }
      .muted { fill: #526579; }
      .blue { fill: #246da7; }
      .red { fill: #af594e; }
      .teal { fill: #247b72; }
      .line { stroke: #aab7c3; stroke-width: 3; fill: none; }
      .flow { stroke: #51657a; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .blueflow { stroke: #2876b9; stroke-width: 3.5; fill: none; marker-end: url(#blueArrow); }
      .redflow { stroke: #be6156; stroke-width: 3.5; fill: none; marker-end: url(#redArrow); }
    </style>
